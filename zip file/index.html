<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="heart-container"></div>
<section id="page1" class="page active">
<h1 class="mainTitle">Happy Birthday My Love ❤️</h1>
<div class="teddyWrapper">
<img src="images/teddy-left.png" class="teddy left">
<img src="images/cake.png" class="cake">
<img src="images/teddy-right.png" class="teddy right">
</div>
<h2 class="question">Are You Excited For What's Next? ❤️</h2>
<div class="buttons">
<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO 😁</button>
</div>
</section>

<section id="page2" class="page">
<h1>Pop Every Balloon 🎈</h1>
<div id="balloons">
<div class="balloon">🎈</div><div class="balloon">🎈</div>
<div class="balloon">🎈</div><div class="balloon">🎈</div>
</div>
<p id="balloonMessage"></p>
</section>

<script src="script.js"></script>
</body>
</html>
